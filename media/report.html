<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'nonce-__NONCE__'; script-src 'nonce-__NONCE__';">
<title>EOAP Validator</title>
<style nonce="__NONCE__">
body{font-family:var(--vscode-font-family);color:var(--vscode-foreground);padding:18px;line-height:1.5}
button,input,select{font:inherit;color:var(--vscode-input-foreground);background:var(--vscode-input-background);border:1px solid var(--vscode-input-border,gray);padding:6px;margin:4px}
button{cursor:pointer}button:disabled{opacity:.5;cursor:default}button.primary{background:var(--vscode-button-background);color:var(--vscode-button-foreground)}
#root,small{overflow-wrap:anywhere;opacity:.8}#summary{padding:10px 0}article{border-top:1px solid var(--vscode-panel-border,gray);padding:12px 0}article p{white-space:pre-wrap;overflow-wrap:anywhere;margin:5px 0}.badge{font-weight:bold}#message{white-space:pre-wrap}label{display:inline-block}
</style>
</head>
<body>
<h1>EOAP Validator</h1><p id="root"></p>
<label>Workflow ID <input id="entrypoint" placeholder="Automatic when unambiguous" aria-label="Workflow ID"></label>
<button id="validate" class="primary">Validate</button><button id="cancel" disabled>Cancel</button>
<p id="message" role="status"></p><div id="summary"></div>
<label>Show <select id="filter"><option value="issues">Issues and review findings</option><option value="all">All checks</option><option value="failed">Failed checks</option><option value="needs-review">Needs review</option></select></label>
<div id="findings"></div>
<script nonce="__NONCE__">
const vscode = acquireVsCodeApi();
let state = {};
const el = id => document.getElementById(id);
el('validate').onclick = () => vscode.postMessage({type:'validate',entrypoint:el('entrypoint').value});
el('cancel').onclick = () => vscode.postMessage({type:'cancel'});
el('filter').onchange = render;
function render(){
 el('root').textContent = state.root || '';
 el('message').textContent = state.message || '';
 el('validate').disabled = !!state.running;
 el('cancel').disabled = !state.running;
 el('summary').textContent = state.report ? Object.entries(state.report.counts).map(([key,value])=>`${key}: ${value}`).join(' · ') + (state.stale ? ' — stale report' : '') : '';
 el('findings').replaceChildren();
 (state.report?.findings || []).forEach((finding,index)=>{
  const filter = el('filter').value;
  if(filter==='issues' && ['passed','not-applicable'].includes(finding.status)) return;
  if(!['issues','all'].includes(filter) && finding.status!==filter) return;
  const article=document.createElement('article');
  const heading=document.createElement('div');heading.className='badge';heading.textContent=`${finding.status} · ${finding.severity} · ${finding.rule_id}`;article.append(heading);
  for(const text of [finding.message,finding.suggestion ? `Suggested correction: ${finding.suggestion}` : '',finding.instance_path.length ? `Invocation: ${finding.instance_path.join('/')}` : '']){
   if(!text)continue;const p=document.createElement('p');p.textContent=text;article.append(p);
  }
  const location=document.createElement('p');location.textContent=`${finding.location.uri} ${finding.location.path}${finding.location.line ? ':'+finding.location.line+':'+(finding.location.column||1) : ' (no source position)'}`;article.append(location);
  const button=document.createElement('button');button.textContent='Go to source';button.disabled=!!state.stale || !finding.location.line || !finding.location.uri.startsWith('file:');button.onclick=()=>vscode.postMessage({type:'navigate',generation:state.generation,index});article.append(button);
  el('findings').append(article);
 });
}
window.addEventListener('message',event=>{if(event.data?.type!=='state')return;state=event.data;if(document.activeElement!==el('entrypoint'))el('entrypoint').value=state.entrypoint||'';render();});
vscode.postMessage({type:'ready'});
</script>
</body>
</html>
